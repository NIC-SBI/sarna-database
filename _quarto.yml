project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
  resources:
    - "data/public/*.csv"
    - "assets/js/database.js"

website:
  title: "saRNA Database"
  description: "A curated literature resource for small activating RNA sequences, experimental conditions, and reported outcomes."
  navbar:
    title: "saRNA Database"
    left:
      - text: "Home"
        href: index.qmd
      - text: "Database"
        href: database.qmd
      - text: "Methods"
        href: methods.qmd
      - text: "Archive"
        href: downloads.qmd
      - text: "Citation"
        href: citation.qmd
      - text: "Contact"
        href: contact.qmd
      - text: "About"
        href: about.qmd
    right:
      - text: "GitHub repository"
        href: "https://github.com/{{< var github-organization >}}/{{< var repository-name >}}"

format:
  html:
    theme: default
    css: assets/css/styles.css
    toc: true
    toc-title: "On this page"
    page-navigation: true
    anchor-sections: true
    include-in-header: _includes/robots.html
    include-after-body: _includes/site-footer.html

filters:
  - scripts/project-links.lua
